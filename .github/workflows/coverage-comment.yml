name: Coverage Comment

# Runs after the unprivileged "Unit Tests" workflow completes on a PR.
# Downloads the coverage artifact and comments on the pull request.
on:
  workflow_run:
    workflows: ["Unit Tests"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: "Publish coverage comment"
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number
        id: pr
        run: echo "number=$(cat pr_number.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish coverage summary
        uses: MishaKav/pytest-coverage-comment@v1.1.53
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Coverage Report
          issue-number: ${{ steps.pr.outputs.number }}
