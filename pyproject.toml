[project]
name = "hisense-vidaa"
description = "Home Assistant smart TV integration for Hisense VIDAA OS"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "defusedxml>=0.7.1",
    "paho-mqtt>=1.6.1",
]

[dependency-groups]
dev = [
    "codespell>=2.3.0",
    "homeassistant-stubs>=2024.1.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.6.0",
    "voluptuous-stubs>=0.1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long
    "E402",   # module import not at top of file (test_client.py)
    "SIM108", # use ternary operator
    "SIM118", # use key in dict
    "RUF001", # ambiguous unicode characters in string
    "RUF002", # ambiguous unicode characters in docstring
    "RUF003", # ambiguous unicode characters in comment
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.codespell]
quiet-level = 2
skip = "./.git/*,./.pytest_cache/*,./.ruff_cache/*,*.png,*.p12,*.pem,*.key,credentials.json"
ignore-words-list = "hass,vidaa,remotenow"

[tool.mypy]
python_version = "3.12"
show_error_codes = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

