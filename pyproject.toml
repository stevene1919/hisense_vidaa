[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long
    "E402",   # module import not at top of file (test_client.py)
    "SIM108", # use ternary operator
    "SIM118", # use key in dict
    "RUF001", # ambiguous unicode characters in string
    "RUF002", # ambiguous unicode characters in docstring
    "RUF003", # ambiguous unicode characters in comment
]

[tool.ruff.lint.isort]
combine-as-imports = true
