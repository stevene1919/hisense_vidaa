# ==============================================================================
# Hisense VIDAA TV - TV Card Configuration
# ==============================================================================
# Prerequisites:
# 1. Install 'tv-card' from HACS (https://github.com/marcelveldt/tv-card)
# 2. Replace 'remote.bedroom_smart_tv_remote' and 'media_player.bedroom_smart_tv'
#    with your actual entity IDs.
# ==============================================================================

type: custom:tv-card
entity: remote.bedroom_smart_tv_remote
name: Bedroom TV
power:
  service: remote.send_command
  service_data:
    entity_id: remote.bedroom_smart_tv_remote
    command: power
