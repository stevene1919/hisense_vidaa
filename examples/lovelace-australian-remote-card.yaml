            - margin: 2px
          icon:
            - color: "#ffffff"
            - width: 20px
            - height: 20px

  # ----------------------------------------------------------------------------
  # ROW 8: D-PAD (UP, LEFT, OK, RIGHT, DOWN)
  # ----------------------------------------------------------------------------
  - type: custom:stack-in-card
    mode: vertical
    card_mod:
      style: |
        ha-card {
          background: radial-gradient(circle, #22252e 0%, #17191f 100%) !important;
          border-radius: 50% !important;
          border: 2px solid #2f3440 !important;
          box-shadow: inset 0 3px 8px rgba(0,0,0,0.6), 0 4px 10px rgba(0,0,0,0.5) !important;
          width: 184px !important;
          height: 184px !important;
          margin: 6px auto !important;
          padding: 4px !important;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: true
            icon: mdi:chevron-up
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.bedroom_smart_tv_remote
              data:
                command: up
            styles:
              card:
                - background-color: transparent
                - height: 42px
                - border-radius: 50%
                - border: none
                - box-shadow: none
              icon:
                - color: "#ffffff"
                - width: 22px
                - height: 22px

      - type: horizontal-stack
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: true
            icon: mdi:chevron-left
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
