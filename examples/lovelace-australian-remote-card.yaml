# ==============================================================================
# Hisense VIDAA TV - Australian EN2G30H Custom Remote Card
# ==============================================================================
# This configuration creates an exact pixel-accurate replica of the Australian
# Hisense TV remote control (EN2G30H) with 12 streaming app buttons, color keys,
# D-pad, rocker switches, info buttons, and number pad.
#
# Prerequisites:
# 1. Install 'button-card' from HACS (https://github.com/custom-cards/button-card)
# 2. Install 'stack-in-card' from HACS (https://github.com/custom-cards/stack-in-card)
# 3. Install 'card-mod' from HACS (https://github.com/thomasloven/lovelace-card-mod)
# 4. Replace 'remote.bedroom_smart_tv_remote' and 'media_player.bedroom_smart_tv'
#    with your own entity IDs if needed.
# ==============================================================================

type: custom:stack-in-card
mode: vertical
card_mod:
  style: |
    ha-card {
      background: linear-gradient(180deg, #22252c 0%, #16181b 35%, #0e0f12 100%) !important;
      border-radius: 46px !important;
      border: 2px solid #333742 !important;
      box-shadow: 0 20px 48px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.18), inset 0 -3px 8px rgba(0,0,0,0.85) !important;
      max-width: 320px;
      margin: 0 auto;
      padding: 22px 14px 24px 14px;
    }
cards:
  # ----------------------------------------------------------------------------
  # ROW 1: POWER & INPUT
  # ----------------------------------------------------------------------------
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        show_name: false
        show_icon: true
        icon: mdi:power
        tap_action:
          action: perform-action
          perform_action: remote.send_command
          target:
            entity_id: remote.bedroom_smart_tv_remote
          data:
            command: power
        styles:
          card:
            - background-color: "#d32f2f"
            - height: 44px
            - width: 44px
            - border-radius: 50%
            - box-shadow: "0 3px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2)"
            - border: "1px solid rgba(255,255,255,0.1)"
            - padding: 0px
            - margin: 2px
          icon:
            - color: "#ffffff"
            - width: 22px
            - height: 22px

      - type: custom:button-card
        color_type: blank-card
        styles:
          card:
            - height: 44px
            - background: transparent
            - box-shadow: none
            - border: none

      - type: custom:button-card
        show_name: true
        show_icon: false
        name: INPUT
        tap_action:
          action: perform-action
          perform_action: remote.send_command
          target:
            entity_id: remote.bedroom_smart_tv_remote
          data:
            command: input
        styles:
          card:
            - background-color: "#2c303a"
            - height: 36px
            - width: 76px
            - border-radius: 18px
            - box-shadow: "0 3px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15)"
            - border: "1px solid rgba(255,255,255,0.1)"
            - padding: 0px
            - margin: 4px 2px
          name:
            - color: "#e0e0e0"
            - font-size: 11.5px
            - font-weight: 800
            - letter-spacing: 0.5px

  # ----------------------------------------------------------------------------
  # ROW 2: APP GRID (Disney+, YouTube, Prime Video)
  # ----------------------------------------------------------------------------
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        show_name: true
        show_icon: false
        name: Disney+
        tap_action:
          action: perform-action
          perform_action: media_player.select_source
          target:
            entity_id: media_player.bedroom_smart_tv
          data:
            source: "Disney+"
        styles:
          card:
            - background-color: "#ffffff"
            - height: 38px
            - border-radius: 19px
            - box-shadow: "0 2px 5px rgba(0,0,0,0.3)"
            - padding: 0px
            - margin: 3px
          name:
            - color: "#113ccf"
            - font-size: 11px
            - font-weight: 900

      - type: custom:button-card
        show_name: true
        show_icon: true
        name: " "
        icon: mdi:youtube
        tap_action:
          action: perform-action
          perform_action: media_player.select_source
          target:
            entity_id: media_player.bedroom_smart_tv
          data:
            source: "YouTube"
        styles:
          card:
            - background-color: "#ffffff"
            - height: 38px
            - border-radius: 19px
            - box-shadow: "0 2px 5px rgba(0,0,0,0.3)"
            - padding: 0px
            - margin: 3px
