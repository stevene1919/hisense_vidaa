  # ----------------------------------------------------------------------------
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        show_name: false
        show_icon: true
        icon: mdi:format-list-bulleted-square
        tap_action:
          action: perform-action
          perform_action: remote.send_command
          target:
            entity_id: remote.bedroom_smart_tv_remote
          data:
            command: menu
        styles:
