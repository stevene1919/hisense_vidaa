            show_name: false
            show_icon: true
            icon: mdi:volume-off
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.bedroom_smart_tv_remote
              data:
                command: mute
            styles:
              card:
                - background-color: "#242730"
