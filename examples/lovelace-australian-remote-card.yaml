              name:
                - color: "#ffffff"
                - font-size: 20px
                - font-weight: 600

      # Center Column (Home & Mute)
      - type: vertical-stack
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: true
            icon: mdi:home-outline
            tap_action:
              action: perform-action
              perform_action: remote.send_command
