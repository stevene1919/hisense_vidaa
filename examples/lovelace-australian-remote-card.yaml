        show_name: true
        show_icon: false
        name: prime<br>video
        tap_action:
          action: perform-action
          perform_action: media_player.select_source
          target:
            entity_id: media_player.bedroom_smart_tv
          data:
            source: "Prime Video"
        styles:
          card:
            - background-color: "#ffffff"
            - height: 38px
            - border-radius: 19px
            - box-shadow: "0 2px 5px rgba(0,0,0,0.3)"
            - padding: 0px
            - margin: 3px
          name:
            - color: "#00a8e1"
            - font-size: 9.5px
            - font-weight: 800
            - line-height: 1.1

