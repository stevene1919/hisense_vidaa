# ==============================================================================
# Hisense VIDAA TV - US Edition Custom Remote Card
# ==============================================================================
# This configuration creates a pixel-accurate replica of the North American / US
# Hisense TV remote control with popular US streaming services (Netflix, YouTube,
# Prime Video, Disney+, Hulu, Peacock, Max, Tubi), D-pad navigation, volume/channel
# rockers, media controls, and Closed Captioning (CC) shortcuts.
#
# Optimized for Light/Dark themes and Chrome Forced-Dark Mode.
#
# Prerequisites:
# 1. Install 'button-card' from HACS (https://github.com/custom-cards/button-card)
# 2. Install 'stack-in-card' from HACS (https://github.com/custom-cards/stack-in-card)
# 3. Install 'card-mod' from HACS (https://github.com/thomasloven/lovelace-card-mod)
# 4. Replace 'remote.living_room_hisense_vidaa_tv_remote' and 'media_player.living_room_hisense_vidaa_tv'
#    with your entity IDs if needed.
# ==============================================================================

type: custom:stack-in-card
mode: vertical
keep:
  background: true
  box_shadow: true
  border_radius: true
card_mod:
  style: |
    ha-card {
      background: linear-gradient(180deg, #22252c 0%, #16181b 35%, #0e0f12 100%) !important;
      border-radius: 46px !important;
      border: 2px solid #333742 !important;
      box-shadow: 0 20px 48px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.18), inset 0 -3px 8px rgba(0,0,0,0.85) !important;
      max-width: 320px;
      margin: 0 auto;
      padding: 22px 14px 24px 14px;
      forced-color-adjust: none !important;
      color-scheme: dark !important;
    }
cards:
- type: horizontal-stack
  cards:
  - type: custom:button-card
    show_name: false
    show_icon: true
    icon: mdi:power
    tap_action:
      action: perform-action
      perform_action: remote.send_command
      target:
        entity_id: remote.living_room_hisense_vidaa_tv_remote
      data:
        command: power
    styles:
      card:
      - background: '#242730 !important'
      - background-color: '#242730 !important'
      - forced-color-adjust: none !important
      - height: 44px
      - width: 44px
      - border-radius: 50%
      - box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.15)
      - border: 1px solid rgba(255,255,255,0.1)
      - padding: 0px
      - margin: 2px
      icon:
      - color: '#ff3b30 !important'
      - width: 24px
      - height: 24px
      - filter: drop-shadow(0 0 5px rgba(255, 59, 48, 0.75))
  - type: custom:button-card
    show_name: false
    show_icon: true
    icon: mdi:microphone
    tap_action:
      action: perform-action
      perform_action: remote.send_command
      target:
        entity_id: remote.living_room_hisense_vidaa_tv_remote
      data:
        command: voice
    styles:
      card:
      - background: '#2c303a !important'
      - background-color: '#2c303a !important'
      - forced-color-adjust: none !important
      - height: 40px
      - width: 40px
      - border-radius: 50%
      - box-shadow: 0 3px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15)
      - border: 1px solid rgba(255,255,255,0.1)
      - padding: 0px
      - margin: 4px auto
      icon:
      - color: '#4285f4 !important'
      - width: 20px
      - height: 20px
  - type: custom:button-card
    show_name: true
    show_icon: false
    name: INPUT
    tap_action:
      action: perform-action
      perform_action: remote.send_command
      target:
        entity_id: remote.living_room_hisense_vidaa_tv_remote
      data:
        command: input
    styles:
      card:
      - background: '#2c303a !important'
      - background-color: '#2c303a !important'
      - forced-color-adjust: none !important
      - height: 36px
      - width: 76px
      - border-radius: 18px
      - box-shadow: 0 3px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15)
      - border: 1px solid rgba(255,255,255,0.1)
      - padding: 0px
      - margin: 4px 2px
      name:
      - color: '#e0e0e0 !important'
      - font-size: 11.5px
      - font-weight: 800
      - letter-spacing: 0.5px
