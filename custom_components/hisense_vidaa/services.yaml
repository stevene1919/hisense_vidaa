send_key:
  name: Send Key
  description: Send a remote control key command to the TV.
  target:
    device:
      integration: hisense_vidaa
    entity:
      integration: hisense_vidaa
      domain:
        - media_player
        - remote
  fields:
    key:
      name: Key
      description: The remote key code or alias to send (e.g. KEY_POWER, KEY_VOLUMEUP, home, menu, ok, back).
      required: true
      example: KEY_HOME
      selector:
        text:
    repeat:
      name: Repeat
      description: Number of times to repeat the key press.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    delay:
      name: Delay
      description: Delay in seconds between repeated key presses.
      required: false
      default: 0.2
      selector:
        number:
          min: 0.05
          max: 2.0
          step: 0.05
          unit_of_measurement: seconds
          mode: slider

launch_app:
  name: Launch App
  description: Launch a smart TV application on the TV.
  target:
    device:
      integration: hisense_vidaa
    entity:
      integration: hisense_vidaa
      domain:
        - media_player
  fields:
    app:
      name: App
      description: Application name or URL (e.g. Netflix, YouTube, Prime Video, Plex, netflix://).
      required: true
      example: Netflix
      selector:
        text:
