send_key:
  name: Send Key
  description: Send a remote control key command to the TV.
  target:
    entity:
      integration: hisense_vidaa
      domain:
        - media_player
        - remote
  fields:
    key:
      name: Key
      description: The remote key code or alias to send (e.g. KEY_POWER, KEY_VOLUMEUP, home, menu, ok, back).
      required: true
      example: KEY_HOME
      selector:
        text:
    repeat:
      name: Repeat
      description: Number of times to repeat the key press.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    delay:
      name: Delay
      description: Delay in seconds between repeated key presses.
      required: false
      default: 0.2
      selector:
        number:
          min: 0.05
          max: 2.0
          step: 0.05
          unit_of_measurement: seconds
          mode: slider

send_key_sequence:
  name: Send Key Sequence
  description: Send a sequence of remote key commands with configurable delay between keys.
  target:
    entity:
      integration: hisense_vidaa
      domain:
        - media_player
        - remote
  fields:
    sequence:
      name: Key Sequence
      description: List of key codes or comma-separated keys to send sequentially (e.g. ["home", "down", "ok"]).
      required: true
      example: ["home", "down", "ok"]
      selector:
        object:
    delay:
      name: Delay
      description: Delay in seconds between each sequential key press.
      required: false
      default: 0.3
      selector:
        number:
          min: 0.05
          max: 5.0
          step: 0.05
          unit_of_measurement: seconds
          mode: slider

change_channel:
  name: Change Channel
  description: Directly tune to a numeric TV channel by dispatching sequential number keys.
  target:
    entity:
      integration: hisense_vidaa
      domain:
        - media_player
        - remote
  fields:
    channel:
      name: Channel Number
      description: The channel number to tune to (e.g. 701, 10, 7).
      required: true
      example: 701
      selector:
        text:
    confirm:
      name: Confirm
      description: Send OK/Enter immediately after digits to tune without waiting for TV timeout.
      required: false
      default: true
      selector:
        boolean:
    delay:
      name: Delay
      description: Delay in seconds between digits.
      required: false
      default: 0.25
      selector:
        number:
          min: 0.05
          max: 2.0
          step: 0.05
          unit_of_measurement: seconds
          mode: slider

launch_app:
  name: Launch App
  description: Launch a smart TV application on the TV.
  target:
    entity:
      integration: hisense_vidaa
      domain:
        - media_player
  fields:
    app:
      name: App
      description: Application name or URL; optional when app_id is supplied.
      required: false
      example: YouTube
      selector:
        text:
    app_id:
      name: App ID
      description: TV application ID to launch. If omitted, the ID is looked up from the app list.
      required: false
      example: "3"
      selector:
        text:
    app_name:
      name: App Name
      description: Application name to include in the launch request.
      required: false
      example: YouTube
      selector:
        text:
    url:
      name: URL
      description: URL or deep link to pass to the application.
      required: false
      example: https://youtu.be/dQw4w9WgXcQ?si=dflf0w3Fuwu2rnI2
      selector:
        text:

set_picture_setting:
  name: Set Picture Setting
  description: Change a specific TV picture menu setting or calibration parameter.
  target:
    entity:
      integration: hisense_vidaa
      domain:
        - media_player
        - select
        - number
  fields:
    menu_id:
      name: Menu ID
      description: The numeric menu ID to adjust (e.g. 91 for Picture Mode, 92 for Backlight, 93 for Brightness, 94 for Contrast).
      required: true
      example: 91
      selector:
        number:
          min: 1
          max: 999
          mode: box
    menu_value:
      name: Menu Value
      description: The new setting value or preset name (e.g. "Cinema Day", 80, 50).
      required: true
      example: "Cinema Day"
      selector:
        text:

set_sound_setting:
  name: Set Sound Setting
  description: Change a specific TV sound menu setting or equalizer preset.
  target:
    entity:
      integration: hisense_vidaa
      domain:
        - media_player
        - select
  fields:
    menu_id:
      name: Menu ID
      description: The numeric menu ID to adjust (e.g. 1 for Sound Mode).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 999
          mode: box
    menu_value:
      name: Menu Value
      description: The new sound mode or value (e.g. "Theatre", "Standard").
      required: true
      example: "Theatre"
      selector:
        text:

send_text_input:
  name: Send Text Input
  description: Send virtual keyboard text string to active on-screen input field or browser search bar.
  target:
    entity:
      integration: hisense_vidaa
      domain:
        - media_player
        - remote
  fields:
    text:
      name: Text
      description: Text string to input.
      required: true
      example: "Action Movies"
      selector:
        text:
    action:
      name: Action
      description: Input action type (insert, replace, clear).
      required: false
      default: insert
      selector:
        select:
          options:
            - insert
            - replace
            - clear


